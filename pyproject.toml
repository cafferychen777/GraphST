[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphst-modern"
version = "1.1.1.post3"
description = "Maintained Python distribution of GraphST"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-only"
license-files = ["LICENSE.md"]
authors = [
    {name = "Yahui Long", email = "longyh@immunol.a-star.edu.sg"},
]
maintainers = [
    {name = "Chen Yang", email = "cafferychen777@tamu.edu"},
]
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=1.5",
    "POT>=0.9",
    "scanpy>=1.10,<2",
    "scikit-learn>=1.2",
    "scikit-misc>=0.3",
    "scipy>=1.10",
    "torch>=2.1,<3",
    "tqdm>=4.60",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
r-clustering = ["rpy2>=3.6,<3.7"]

[project.urls]
Homepage = "https://github.com/cafferychen777/GraphST"
Repository = "https://github.com/cafferychen777/GraphST"
"Original project" = "https://github.com/JinmiaoChenLab/GraphST"
Issues = "https://github.com/cafferychen777/GraphST/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["GraphST", "GraphST.*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
